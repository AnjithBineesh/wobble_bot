odom_node:
  ros__parameters:
    # Calibrated geometry from Squirtle Bot
    wheel_radius: 0.030
    left_wheel_radius: 0.030
    right_wheel_radius: 0.030
    # Estimated physical track from the measured motor and wheel layout.
    # Preserve the calibrated effective base (0.285 m) for tire scrub.
    wheel_base: 0.262
    wheel_base_scale: 1.08778626
    # Measured encoder resolution: 330 pulses/rev x 4 quadrature = 1320 ticks/rev
    ticks_per_rev: 1320
    left_ticks_per_rev: 1320.0
    right_ticks_per_rev: 1320.0
    left_distance_scale: 1.0
    right_distance_scale: 1.0
    left_speed_scale: 1.0
    right_speed_scale: 1.0
    publish_rate_hz: 50.0
    odom_topic: /wheel/odom
    joint_state_topic: /joint_states
    odom_frame: odom
    base_frame: base_footprint
    left_wheel_joint: joint_left_wheel
    right_wheel_joint: joint_right_wheel
    publish_tf: false
    max_tick_jump: 0
    pose_covariance_xy: 0.02
    pose_covariance_yaw: 0.08
    twist_covariance_linear: 0.05
    twist_covariance_angular: 0.10
