odom_node:
  ros__parameters:
    # Keep wheel_radius for a shared nominal value, then refine each side below.
    wheel_radius: 0.0335
    left_wheel_radius: 0.0638
    right_wheel_radius: 0.0638
    wheel_base: 0.31
    wheel_base_scale: 1.0
    # Full quadrature counts all A/B transitions. If your motor spec says
    # 330 pulses/rev for one channel, full quadrature is usually 330 * 4.
    ticks_per_rev: 1320
    # Legacy names still work, but distance_scale is the clearer knob.
    left_distance_scale: 1.0
    right_distance_scale: 1.0
    left_speed_scale: 1.0
    right_speed_scale: 1.0
    publish_rate_hz: 50.0
    odom_topic: /wheel/odom
    joint_state_topic: /joint_states
    odom_frame: odom
    base_frame: base_link
    left_wheel_joint: joint_left_wheel
    right_wheel_joint: joint_right_wheel
    publish_tf: false
    # Set this only if you see occasional impossible jumps from the encoder node.
    max_tick_jump: 0
    pose_covariance_xy: 0.02
    pose_covariance_yaw: 0.08
    twist_covariance_linear: 0.05
    twist_covariance_angular: 0.10
