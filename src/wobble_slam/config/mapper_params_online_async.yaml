slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # Ceres Solver Plugin for Pose Graph Optimization / Loop Closure
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    resolution: 0.05
    max_laser_range: 12.0
    min_laser_range: 0.15
    minimum_time_interval: 0.1
    transform_publish_period: 0.05
    map_update_interval: 0.5

    # Scan Matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.08
    link_scan_maximum_distance: 1.5

    # --- LOOP CLOSING CONFIGURATION ---
    do_loop_closing: true
    loop_search_maximum_distance: 5.0             # Search distance in the graph to find candidate loop closures
    loop_match_minimum_chain_size: 3              # Minimum node separation before attempting a loop closure (agile indoor)
    loop_match_maximum_variance_coarse: 3.0       # Maximum acceptable variance for coarse candidate match
    loop_match_minimum_response_coarse: 0.25      # Threshold to trigger fine search
    loop_match_minimum_response_fine: 0.35        # Threshold to accept loop closure and optimize graph

    # Correlation Search Space for Local Scan Match
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Search Space for Loop Closures
    loop_search_space_dimension: 8.0              # Search window size for loop candidates (meters)
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Variance Penalties
    distance_variance_penalty: 0.2
    angle_variance_penalty: 0.3
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.7
    minimum_distance_penalty: 0.3
    use_response_expansion: true
    occupancy_threshold: 0.1
