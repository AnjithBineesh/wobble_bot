encoder_node:
  ros__parameters:
    gpio_chip: 4
    left_a_pin: 20
    left_b_pin: 21
    right_a_pin: 26
    right_b_pin: 19

    # Set to -1 if a wheel counts downward when rotated forward.
    left_direction: 1
    right_direction: -1

    # Poll mode: timer-based GPIO reads — no lgpio interrupt callbacks needed.
    # More reliable than edge mode on Raspberry Pi 5 / lgpio.
    decode_mode: poll
    poll_rate_hz: 5000.0
    publish_rate_hz: 50.0
    diagnostics_rate_hz: 1.0
    stable_samples_required: 1
    # Set to 0 to disable still-drift warning during normal driving motion.
    max_still_ticks_per_sec: 0
